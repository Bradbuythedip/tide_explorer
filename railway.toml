# Railway project config.
#
# Most of the Nixpacks configuration lives in nixpacks.toml at the
# repo root because Railway was silently ignoring the nested
# build.nixpacksConfig form. railway.toml just tells Railway to use
# nixpacks as the builder (which is the default but we make it
# explicit) and any future Railway-specific options (deploy regions,
# replica counts, etc) would go here.

[build]
builder = "nixpacks"
