# prevblock backend reverse proxy.
#
# Place this at /etc/nginx/sites-available/api.prevblock.com and
# `sudo ln -s` it into sites-enabled.
#
# Prereqs:
#   - DNS A record api.prevblock.com -> your box's public IP
#   - certbot --nginx for the cert (rewritten by certbot on first run)
#   - The backend running on 127.0.0.1:3001 with
#     CORS_ALLOWED_ORIGINS=https://prevblock.com,https://www.prevblock.com

server {
    listen 80;
    listen [::]:80;
    server_name api.prevblock.com;

    # Let's Encrypt webroot challenge — leave this here so renewals work
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Force HTTPS for everything else
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.prevblock.com;

    # certbot --nginx will fill these in. The placeholders below match
    # certbot's default output paths.
    ssl_certificate     /etc/letsencrypt/live/api.prevblock.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.prevblock.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Lock down to the routes we actually expose. Anything else 404s
    # at nginx without the backend ever seeing it.
    location = /healthz {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location = /readyz {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /api/v1/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generous timeouts for the gettxoutsetinfo path which can
        # take a few seconds when the cache is cold.
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Block everything else explicitly
    location / {
        return 404;
    }

    # Decent default rate limit at the edge in addition to the
    # backend's per-route Fastify limit.
    limit_req_zone $binary_remote_addr zone=prevblock_api:10m rate=20r/s;
    limit_req zone=prevblock_api burst=40 nodelay;
}
